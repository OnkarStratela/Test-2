# bench/config.yaml
#
# Single source of truth for the beer-pour RFID reliability test.
# Edit this file (not run_test_matrix.py) to add tag types, change
# the power sweep, or swap the SSH target.

# -----------------------------------------------------------------
# SSH target: the Linux box that has the CAEN reader plugged in.
# The harness runs the binary remotely and pulls each CSV back here.
# -----------------------------------------------------------------
ssh:
  host: 192.168.1.10        # <-- EDIT: IP / hostname of the Linux box
  user: pi                  # <-- EDIT: login user
  port: 22
  # Authentication: prefer key-based, but password works too.
  # Leave both empty to use the ssh agent / default key on this PC.
  key_path: ""              # e.g. C:\Users\it241\.ssh\id_ed25519
  password: ""              # use only if no key available (less secure)
  remote_workdir: "~/Test-2"   # <-- EDIT: where rfid_gc_live was compiled on the Linux box
  remote_binary: "./rfid_gc_live"
  # Some installs need sudo to access /dev/ttyACM0. If yours does,
  # set this to true AND make sure passwordless sudo is configured.
  use_sudo: false

# -----------------------------------------------------------------
# Measurement parameters.
# -----------------------------------------------------------------
measurement:
  trial_duration_s: 3.0       # length of one trial (matches your "first three seconds")
  decision_window_ms: 250     # ~12 data points per 3-s trial
  # Inter-trial pause so the operator can reset the setup. Hardware-
  # side; the harness will WAIT for ENTER between trials anyway.
  inter_trial_pause_s: 1.0

# Powers to sweep, in mW. Add/remove as needed (range 1..316).
powers_mw: [30, 175, 316]

# -----------------------------------------------------------------
# Conditions = liquid state of the setup during the trial.
# -----------------------------------------------------------------
conditions:
  - id: dry
    label: "Dry (drip tray empty, mug empty)"
    operator_prompt: "Make sure the drip tray and the mug are completely DRY. No droplets."
  - id: wet
    label: "Wet (beer pouring into mug during trial)"
    operator_prompt: "Start the beer pour the moment you press ENTER. Aim into the mug; some drips into the tray are expected and part of the test."

# -----------------------------------------------------------------
# Mug layouts = which antenna(s) have a mug above them during the trial.
# `expected` says which antenna SHOULD see a tag for this layout; the
# harness uses that to compute miss-read % (mug present but no
# attribution) and cross-read % (mug absent but attribution appears,
# or wrong-tag attribution).
# -----------------------------------------------------------------
layouts:
  - id: ant0_only
    label: "Mug A over antenna 0 only"
    expected: { ant0: true, ant1: false }
    operator_prompt: "Place ONE mug centred over antenna 0. Antenna 1 must be empty."

  - id: ant1_only
    label: "Mug B over antenna 1 only"
    expected: { ant0: false, ant1: true }
    operator_prompt: "Place ONE mug centred over antenna 1. Antenna 0 must be empty."

  - id: both
    label: "Mug A over antenna 0, Mug B over antenna 1"
    expected: { ant0: true, ant1: true }
    operator_prompt: "Place ONE mug centred over each antenna. Both antennas have a mug."

# -----------------------------------------------------------------
# Tag types. Start with foam; add more entries here to extend the
# test. `reference_image` is embedded into the Excel summary as a
# small thumbnail so future readers know which tag was tested.
# -----------------------------------------------------------------
tag_types:
  - id: foam
    label: "Foam tag (CP15710-01)"
    reference_image: "photos/tags/foam.png"
    notes: |
      White-foam-backed RFID inlay, ~5x1.5 cm.
      Mounted on the bottom of the reusable plastic mug.

  # Example of a future tag type (uncomment + add image when ready):
  # - id: sticker
  #   label: "Standard paper sticker tag"
  #   reference_image: "photos/tags/sticker.png"
  #   notes: "Generic UHF sticker inlay."

# -----------------------------------------------------------------
# Reliability thresholds. The Summary sheet highlights cells that
# violate either of these (red = below threshold).
# -----------------------------------------------------------------
thresholds:
  attribution_rate_min_pct: 80.0   # below this -> miss-read regime
  cross_read_rate_max_pct: 0.0     # any cross-read at all is a failure
